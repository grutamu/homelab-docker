services:
  frigate:
    container_name: frigate
    restart: unless-stopped
    # Pinned, not `:stable` — bump this and the template's `version:` together.
    # See readme.md.
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    shm_size: "450mb"
    devices:
      # OpenVINO on the Arc A310; no Coral.
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-data/frigate:/config
      # The directory, not config.yml itself — see readme.md.
      - ./config:/config-src
      - nfs-frigate:/media/frigate
      - type: tmpfs # reduces SSD wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      CONFIG_FILE: /config-src/config.yml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.calzone.zone`)"
      - "traefik.http.routers.frigate.entrypoints=https"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.routers.frigate.middlewares=pocket-id-auth@file"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"
    networks:
      - proxy

volumes:
  nfs-frigate:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/ssd-pool/frigate"

networks:
  proxy:
    external: true