services:
  frigate:
    container_name: frigate
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "450mb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      # - /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
      # - /dev/video11:/dev/video11 # For Raspberry Pi 4B
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-data/frigate:/config
      - type: bind
        source: ./config/config.yml
        target: /config/config.yml
        # read_only: true
      - nfs-frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    # ports:
    #   - "8971:8971"
    #   - "5000:5000" # Internal unauthenticated access. Expose carefully.
    #   - "8554:8554" # RTSP feeds
    #   - "8555:8555/tcp" # WebRTC over tcp
    #   - "8555:8555/udp" # WebRTC over udp
    # environment:
    #   PLUS_API_KEY: ${PLUS_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.calzone.zone`)"
      - "traefik.http.routers.frigate.entrypoints=https"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.routers.frigate.middlewares=pocket-id-auth@file"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"
    networks:
      - proxy

  # A second go2rtc, separate from the one Frigate embeds, whose only job is
  # publishing cameras to Apple HomeKit.
  #
  # HomeKit pairing is HAP announced over mDNS, so the accessory has to sit on
  # the LAN at layer 2 -- a bridged container cannot do it. Frigate's own docs
  # solve that by putting *Frigate* in host network mode, but that would also
  # drop its unauthenticated API on :5000 onto the LAN, where today it is
  # reachable only through Traefik's OIDC middleware. This container takes the
  # host namespace instead and leaves the frigate service above untouched.
  #
  # It pulls from Protect directly rather than from Frigate's restream on :8554,
  # which would have meant publishing that port on the host -- the same exposure
  # this split exists to avoid. go2rtc opens a source only while something is
  # consuming it, so a HomeKit camera nobody is watching costs Protect nothing.
  go2rtc-homekit:
    container_name: go2rtc-homekit
    restart: unless-stopped
    image: alexxit/go2rtc:1.9.14
    network_mode: host
    # go2rtc writes generated state -- accessory id, private key, paired
    # controllers -- back into the *first* config file it is given. That one
    # therefore lives on writable storage and is not in git (it holds key
    # material); the repo half is mounted read-only after it.
    command:
      - go2rtc
      - -config
      - /config/pairings.yaml
      - -config
      - /config/go2rtc-homekit.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-data/go2rtc-homekit:/config
      - type: bind
        source: ./config/go2rtc-homekit.yaml
        target: /config/go2rtc-homekit.yaml
        read_only: true

volumes:
  nfs-frigate:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/ssd-pool/frigate"

networks:
  proxy:
    external: true