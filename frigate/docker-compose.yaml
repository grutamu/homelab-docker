services:
  frigate:
    container_name: frigate
    restart: unless-stopped
    # Pinned, not `:stable`. Every Frigate minor rewrites the config schema and
    # the models are extra="forbid", so an unattended jump can leave the stack
    # refusing to start. Bumping this is a reviewable commit, and the version in
    # config/config.yml.tpl has to move with it.
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    shm_size: "450mb" # update for your cameras based on calculation above
    devices:
      # No Coral here — detection is OpenVINO on the Intel iGPU, so renderD128
      # is the only device needed.
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-data/frigate:/config
      # The *directory*, not config.yml itself. A single-file bind is resolved
      # to an inode once, at container creation. deploy.sh regenerates this file
      # with `op inject -f`, which replaces it rather than rewriting it in place,
      # so the new config lands on a new inode and the container keeps reading
      # the old, now-unlinked one. Every config-only change deployed green and
      # did nothing until some unrelated image bump recreated the container —
      # which is how detection stayed off after #210 merged. Observed directly:
      # host inode=12976152 (mtime 14:59) vs container inode=12976153 (14:53).
      # A directory bind resolves each lookup at access time, so a replaced file
      # is picked up normally.
      - ./config:/config-src
      - nfs-frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    # ports:
    #   - "8971:8971"
    #   - "5000:5000" # Internal unauthenticated access. Expose carefully.
    #   - "8554:8554" # RTSP feeds
    #   - "8555:8555/tcp" # WebRTC over tcp
    #   - "8555:8555/udp" # WebRTC over udp
    environment:
      # Points frigate at the bind-mounted directory above instead of the
      # default /config/config.yml. /config stays the data dir (frigate.db,
      # model_cache, jwt secret), which is why the config cannot simply live
      # there. Frigate, the go2rtc config generator and the ffmpeg path helper
      # all resolve the file through find_config_file(), which reads this.
      CONFIG_FILE: /config-src/config.yml
      # PLUS_API_KEY: ${PLUS_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.calzone.zone`)"
      - "traefik.http.routers.frigate.entrypoints=https"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.routers.frigate.middlewares=pocket-id-auth@file"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"
    networks:
      - proxy

volumes:
  nfs-frigate:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/ssd-pool/frigate"

networks:
  proxy:
    external: true