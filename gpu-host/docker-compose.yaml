---
# ┌────────────────────────────────────────────────────────────────────┐
# │  THIS STACK DOES NOT RUN ON docker01.                              │
# │  It deploys to `gpu-host` (192.168.1.43 / tailscale 100.123.167.70),│
# │  the RTX 3090 box. deploy.sh does not include it — see readme.md.  │
# └────────────────────────────────────────────────────────────────────┘
#
# Exporters only. Prometheus and Grafana stay on docker01 and scrape these
# across Tailscale; the scrape jobs live in monitoring/prometheus/prometheus.yaml.
#
# Both endpoints are unauthenticated, so both bind the Tailscale address
# rather than 0.0.0.0 — that keeps them off the LAN, where this host shares a
# subnet with everything else. The cost is a boot-ordering dependency: if
# tailscale0 has no address yet, the bind fails and the container exits.
# `restart: unless-stopped` retries until Tailscale is up.

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    # Host netns so filesystem/network collectors see the real host, matching
    # how the docker01 node-exporter is configured.
    network_mode: host
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      # Tailscale-only bind. With network_mode: host there is no port mapping
      # to restrict, so the listen address is the only control.
      - '--web.listen-address=100.123.167.70:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  nvidia-gpu-exporter:
    # Wraps `nvidia-smi` rather than DCGM. DCGM's headline value is its
    # profiling metrics (SM/DRAM activity), which need a datacenter card —
    # on a consumer 3090 it reports roughly this same set for a much larger
    # image. Verified against this GPU: 95 series exposed.
    image: utkuozdemir/nvidia_gpu_exporter:1.13.1
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    ports:
      - "100.123.167.70:9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # `utility` is the capability that provides nvidia-smi itself.
              # With only `gpu` the binary is absent and every scrape fails.
              capabilities: [gpu, utility]
