services:
  backrest:
    build: .
    container_name: backrest
    restart: unless-stopped
    volumes:
      - /docker-data/backrest:/data
      - /docker-data:/source
      - ./scripts:/scripts:ro
      - /etc/localtime:/etc/localtime:ro
      - nfs-backup:/backups
    environment:
      - BACKREST_PORT=9898
      - BACKREST_INSTANCE=docker01
      # The image defaults BACKREST_CONFIG to /config/config.json, and /config
      # is not a mount — so the config lived in the container's writable layer
      # and was destroyed the next time the container was recreated. That is
      # why backups silently stopped after 2026-04-10: the repo and plan
      # vanished, backrest came back up with an empty config, and only its
      # default "collect garbage" task was left to schedule. Point it at /data,
      # which is bind-mounted, so config survives alongside the oplog.
      - BACKREST_CONFIG=/data/config.json
      - IMMICH_DB_USER
      - IMMICH_DB_PASSWORD
      - NETBOX_DB_PASSWORD
      - PAPERLESS_DB_PASSWORD
      - MCPJUNGLE_DB_PASSWORD
      - RESTIC_PASSWORD
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.backrest.rule=Host(`backrest.calzone.zone`)"
      - "traefik.http.routers.backrest.entrypoints=https"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.routers.backrest.middlewares=pocket-id-auth@file"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    networks:
      - proxy
      - immich_immich
      - netbox_netbox
      - paperless_paperless
      - mcpjungle_mcpjungle

volumes:
  nfs-backup:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/hdd-pool/backups/docker01"

networks:
  proxy:
    external: true
  immich_immich:
    external: true
  netbox_netbox:
    external: true
  paperless_paperless:
    external: true
  mcpjungle_mcpjungle:
    external: true
