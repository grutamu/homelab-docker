# netops — applied by scripts/sync-profiles.sh. See profiles/obs/profile.conf
# for the directive format.

describe Answers DNS, name-resolution, filtering and addressing questions from AdGuard Home and NetBox, and reconciles documented state against observed state. Strictly read-only. Has NO UniFi access, so routing, VLAN enforcement, firewall rules and switch/AP state are out of scope.

# Model — same single llama.cpp slot as every other agent. `custom_providers` is
# deliberately NOT set: it is a YAML list, no `hermes config set` form can write
# one, and the profile inherits a valid entry by being cloned from `default`.
# See scripts/sync-profiles.sh.
set model.provider custom:Local (hermes:8020)
set model.base_url http://100.123.167.70:8020/v1
set model.default /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.api_mode chat_completions

# 120, not 40. A real investigation — tool_search, describe, then a dozen
# Loki/Prometheus queries with refinements — blows through 40 and the worker
# dies with "Iteration budget exhausted", twice, and the card auto-blocks.
# Turn count is the wrong bound anyway: --max-runtime on the card is wall-clock
# and the dispatcher actually enforces it.
set agent.max_turns 120
set agent.reasoning_effort medium
set database.journal_mode wal

# adguard + netbox only — 33 tools, verified to contain no mutation. The token's
# MCPJungle --allow list is the real boundary; this only points at it.
# MCP_NETOPS_API_KEY is injected by op run, so it never lands in the data dir's
# .env where the dashboard could read it back.
set mcp_servers.homelab.url https://mcp.calzone.zone/mcp
set mcp_servers.homelab.headers.Authorization Bearer ${MCP_NETOPS_API_KEY}
set mcp_servers.homelab.connect_timeout 30.0
set mcp_servers.homelab.enabled true

# Cloning from `default` also inherits its MCP servers. Turn off the ones this
# specialist has no business holding — otherwise it would quietly carry a
# GitHub PAT with repo, issues and PR write scope.
set mcp_servers.github.enabled false
set mcp_servers.truenas.enabled false

# Same lean surface as obs, and for the same reason: every toolset left on is
# schema weight in a prompt that is already the binding constraint. See
# profiles/obs/profile.conf on why `kanban` and `file` stay at their defaults.
enable memory
enable skills
enable todo
enable clarify
enable session_search
disable browser
disable terminal
disable code_execution
disable web
disable image_gen
disable bfl
disable video
disable video_gen
disable tts
disable stt
disable computer_use
disable vision
disable delegation
disable cronjob
