# obs — applied by scripts/sync-profiles.sh. One directive per line.
#
#   describe <text>        → hermes profile describe (kanban decomposer routing)
#   set <key> <value>      → hermes config set (never hand-edit config.yaml)
#   enable|disable <name>  → hermes tools enable/disable
#
# Values may contain spaces; only the first two fields are split.

describe Diagnoses homelab symptoms from Grafana, Prometheus and Loki. Strictly read-only. Owns "why is X broken", "what changed at time T", and "show me the evidence". Cannot touch Proxmox, UniFi or GitHub.

# Model — same single llama.cpp slot as everyone else. Fresh profiles start with
# no custom provider, so the provider has to be declared here as well as selected.
set custom_providers.0.name Local (hermes:8020)
set custom_providers.0.base_url http://100.123.167.70:8020/v1
set custom_providers.0.model /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set custom_providers.0.models.0 /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.provider custom:Local (hermes:8020)
set model.base_url http://100.123.167.70:8020/v1
set model.default /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.api_mode chat_completions

# A diagnostician that needs 150 turns has lost the plot, and every turn is time
# the shared slot isn't serving anyone else.
set agent.max_turns 40
set agent.reasoning_effort medium
set database.journal_mode wal

# Grafana only. The token's MCPJungle --allow list is the real boundary; this
# just points at it. MCP_OBS_API_KEY is injected by op run, so it never lands in
# the data dir's .env where the dashboard could read it back.
set mcp_servers.homelab.url https://mcp.calzone.zone/mcp
set mcp_servers.homelab.headers.Authorization Bearer ${MCP_OBS_API_KEY}
set mcp_servers.homelab.connect_timeout 30.0
set mcp_servers.homelab.enabled true

# Deliberately absent: browser, image_gen, bfl, video*, tts, stt, computer_use,
# terminal, code_execution, web. A read-only diagnostician needs none of them,
# and each one is schema weight in an already-65k-token prompt.
#
# `kanban` and `file` are left at the profile default (enabled). Disabling
# `kanban` would save two tools (kanban_list, kanban_unblock) and risk the
# worker losing kanban_complete — the dispatcher gates the worker tools on
# HERMES_KANBAN_TASK, but a worker that cannot close its own card trips the
# protocol-violation circuit breaker and auto-blocks. Not worth the trade.
enable memory
enable skills
enable todo
enable clarify
enable session_search
disable browser
disable terminal
disable code_execution
disable web
disable image_gen
disable bfl
disable video
disable video_gen
disable tts
disable stt
disable computer_use
disable vision
disable delegation
disable cronjob
