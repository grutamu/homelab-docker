# default — the front door. Applied by scripts/sync-profiles.sh, which
# special-cases this profile: it already exists (never created), its SOUL.md
# lives at the data root rather than under profiles/, and its config is the root
# config.yaml.
#
# Deliberately minimal. `default` is the live Discord agent and keeps the full
# tool surface it has always had — it is the escalation target, and the only
# agent that can act when a read-only specialist hits its limit. Nothing here
# narrows it; see SOUL.md for the invariants that bound how it uses that reach.

describe The front door and orchestrator. Talks to Zach in Discord, answers directly when a question is a single lookup, and files kanban cards to the specialists when work spans domains or needs a written synthesis. Holds the full tool surface and is the escalation target for anything the read-only specialists cannot do.

# Ideally the Discord session would get the kanban toolset, so a mention can file
# work with kanban_create instead of shelling out. It cannot be set from here:
#
#   hermes tools enable kanban --platform discord
#     -> "✗ Unknown toolset 'kanban'"  ... and exits 0, silently.
#
# `kanban` is absent from `known_builtin_toolsets`, so the CLI validator rejects
# it, even though it is a legitimate value — `platform_toolsets.cli` contains it
# (inherited from the pre-Docker install). Adding it to the discord list means
# appending to a YAML list, which `config set` cannot do; same wall as
# custom_providers.
#
# Two ways forward, neither scriptable here:
#   1. Interactive: `docker exec -it hermes-agent hermes tools` and enable it for
#      Discord in the curses UI.
#   2. Do nothing: default has `terminal` on Discord and its SOUL.md tells it to
#      run `hermes kanban create …` directly. Works today.
#
# The `/kanban` slash command is unaffected either way — that is a gateway
# command, not a model tool.
# enable_platform discord kanban

# Serial execution. One llama.cpp slot means extra concurrent workers queue at
# the model rather than accomplish anything.
set kanban.max_in_progress 1
set kanban.max_in_progress_per_profile 1
set kanban.orchestrator_profile default
set delegation.max_concurrent_children 1
