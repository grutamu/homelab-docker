# default — the only profile. Applied by scripts/sync-profiles.sh, which
# special-cases it: it already exists (never created, never cloned), its
# SOUL.md lives at the data root rather than under profiles/, and its config is
# the root config.yaml.
#
# Deliberately minimal. There are no specialists to route to and no read-only
# tier to escalate from, so nothing here narrows the tool surface — see SOUL.md
# for the invariants that bound how the agent uses it, and the MCPJungle
# client's --allow list for what actually enforces them.

describe The homelab agent. Answers questions about the lab through the dashboard, using the MCPJungle tool surface.

# ── Model ────────────────────────────────────────────────────────────────
# gpu-host over Tailscale. These three are scalars, so `hermes config set`
# writes them cleanly — but `model.provider` only resolves if a matching entry
# already exists in the `custom_providers` LIST, and that list cannot be
# written by the CLI at all:
#
#   hermes config set custom_providers.0.name …   -> a dict keyed '0'
#                                                    (doctor: "must be a YAML list")
#   hermes config set --force  …                  -> stores the JSON as a string
#
# The removed install inherited a valid list from its restored backup. A fresh
# data dir has none, so it is bootstrapped once by hand — see readme.md →
# "Bootstrapping the provider". Run that BEFORE the first sync-profiles.sh, or
# these three sets land against a provider name that does not resolve.
set model.provider custom:Local (gpu-host:8090)
set model.base_url http://100.123.167.70:8090/v1
set model.default qwen3.8-27b

# Serial execution. One llama.cpp slot (`total_slots: 1`) means extra
# concurrent workers queue at the model rather than accomplish anything.
set delegation.max_concurrent_children 1
