# virt — applied by scripts/sync-profiles.sh. See profiles/obs/profile.conf
# for the directive format.

describe Read-only Proxmox specialist. Answers what is running on pve-01, how VMs and containers are configured, what they consume, and the state of storage, backups and snapshots. Cannot change anything — writes are refused by the API. Guest-internal application problems belong to obs, not here.

# Model — same single llama.cpp slot as every other agent. `custom_providers` is
# deliberately NOT set: it is a YAML list, no `hermes config set` form can write
# one, and the profile inherits a valid entry by being cloned from `default`.
# See scripts/sync-profiles.sh.
set model.provider custom:Local (hermes:8020)
set model.base_url http://100.123.167.70:8020/v1
set model.default /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.api_mode chat_completions

set agent.max_turns 40
set agent.reasoning_effort medium
set database.journal_mode wal

# proxmox_ro only. Unlike Grafana (--disable-write) or AdGuard (read-only tier),
# the scoping here is NOT in the MCP server — proxmox-mcp-plus registers all 42
# tools including delete_vm regardless of credential. The fence is entirely the
# Proxmox token: mcp-viewer@pam!mcpjungle, privsep=1, with its own PVEAuditor
# ACL entry at / (propagate).
#
# privsep=1 is what makes that meaningful, and it is also what made the token
# useless at first: with privilege separation on, effective rights are the
# INTERSECTION of the user's and the token's own permissions. The user was in
# the `readonly` group, but the token had no ACL entry of its own, so the
# intersection was empty — every read returned nothing and every write 403'd.
# Granting PVEAuditor to the *token* at / with propagate fixed the reads while
# leaving the writes refused.
#
# Verified against pve-01, not assumed: get_vms lists the guests;
# set_vm_description and create_snapshot on a real VM both return 403 Forbidden;
# /access/permissions shows exactly the seven *.Audit privileges.
set mcp_servers.homelab.url https://mcp.calzone.zone/mcp
set mcp_servers.homelab.headers.Authorization Bearer ${MCP_VIRT_API_KEY}
set mcp_servers.homelab.connect_timeout 30.0
set mcp_servers.homelab.enabled true

# Cloning from `default` inherits its MCP servers. virt has no business holding
# a GitHub PAT or the TrueNAS entry.
set mcp_servers.github.enabled false
set mcp_servers.truenas.enabled false

enable memory
enable skills
enable todo
enable clarify
enable session_search
disable browser
disable terminal
disable code_execution
disable web
disable image_gen
disable bfl
disable video
disable video_gen
disable tts
disable stt
disable computer_use
disable vision
disable delegation
disable cronjob
