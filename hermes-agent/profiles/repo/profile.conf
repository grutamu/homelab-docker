# repo — applied by scripts/sync-profiles.sh. See profiles/obs/profile.conf
# for the directive format.

describe Reads grutamu/homelab-docker and answers what the infrastructure is declared to be — compose files, Traefik labels, .env.tpl templates, readmes, commit and PR history. Read-only; proposes changes as text for a human to apply, and cannot deploy. Runtime state belongs to obs, not here.

# Model — same single llama.cpp slot as every other agent. `custom_providers` is
# deliberately NOT set: it is a YAML list, no `hermes config set` form can write
# one, and the profile inherits a valid entry by being cloned from `default`.
# See scripts/sync-profiles.sh.
set model.provider custom:Local (hermes:8020)
set model.base_url http://100.123.167.70:8020/v1
set model.default /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.api_mode chat_completions

set agent.max_turns 40
set agent.reasoning_effort medium
set database.journal_mode wal

# repo is the one specialist that does NOT get an MCPJungle token: GitHub is
# configured directly against api.githubcopilot.com, not through the gateway, so
# its scoping levers are different.
#
# Three fences, narrowest first:
#   X-MCP-Readonly   drops every mutation — no commits, no PRs, no issue edits
#   X-MCP-Toolsets   narrows the surface to code, issues and PRs
#   the PAT's scopes  the real ceiling, set in GitHub, not here
#
# GITHUB_TOKEN is the same injected PAT `default` uses. Sharing it is the weak
# point of this profile: the readonly header is a client-side request, so it
# bounds what this agent's schema offers, not what the credential could do if
# something got around the header. Minting repo its own read-only PAT would fix
# that, and is the obvious next hardening step.
set mcp_servers.github.url https://api.githubcopilot.com/mcp/
set mcp_servers.github.headers.Authorization Bearer ${GITHUB_TOKEN}
set mcp_servers.github.headers.X-MCP-Toolsets repos,issues,pull_requests
set mcp_servers.github.headers.X-MCP-Readonly true
set mcp_servers.github.connect_timeout 30.0
set mcp_servers.github.enabled true

# No homelab MCP: this agent reads the repo, not the infrastructure.
set mcp_servers.homelab.enabled false
set mcp_servers.truenas.enabled false

# `file` stays at its profile default — repo works with file content and a
# worktree workspace is the natural fit for a task that drafts a change.
enable memory
enable skills
enable todo
enable clarify
enable session_search
disable browser
disable terminal
disable code_execution
disable web
disable image_gen
disable bfl
disable video
disable video_gen
disable tts
disable stt
disable computer_use
disable vision
disable delegation
disable cronjob
