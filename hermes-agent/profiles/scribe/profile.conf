# scribe — applied by scripts/sync-profiles.sh. See profiles/obs/profile.conf
# for the directive format.

describe Synthesizes the results of other agents' completed tasks into one written answer for a human. Has NO tools, no MCP servers and no network — it cannot gather evidence, only combine what parent tasks already produced. Assign it as the final node of a fan-out, with the investigating tasks as its parents.

# Model — same single llama.cpp slot as every other agent. `custom_providers`
# is deliberately NOT set here: it is a YAML list, no `hermes config set` form
# can write one, and the profile inherits a valid entry by being cloned from
# `default`. See scripts/sync-profiles.sh.
set model.provider custom:Local (hermes:8020)
set model.base_url http://100.123.167.70:8020/v1
set model.default /models/qwen3.8-27b-gguf/unsloth-q4km/Qwen3.8-27B-Q4_K_M.gguf
set model.api_mode chat_completions

# Synthesis is one pass over material already in context. A scribe that needs
# many turns is investigating, which is exactly what it must not do.
set agent.max_turns 15
set agent.reasoning_effort medium
set database.journal_mode wal

# scribe has NO MCP at all. Cloning from `default` inherits its servers, so
# every one of them is turned off explicitly — that absence is the whole point
# of this profile and must not depend on what `default` happened to have.
set mcp_servers.homelab.enabled false
set mcp_servers.github.enabled false
set mcp_servers.truenas.enabled false

# scribe is the only profile with no MCP client token of its own, which is why it
# needs no entry in .env.tpl. Its inability to check anything is the property that
# keeps it honest: with no tools, an unsupported claim has nowhere to come from
# except invention, and the invariants in SOUL.md name that directly.

enable memory
enable skills
enable todo
enable clarify
enable session_search
disable browser
disable terminal
disable code_execution
disable web
disable image_gen
disable bfl
disable video
disable video_gen
disable tts
disable stt
disable computer_use
disable vision
disable delegation
disable cronjob
