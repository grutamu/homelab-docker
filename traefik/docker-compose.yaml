services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
      # - 443:443/tcp # Uncomment if you want HTTP3
      # - 443:443/udp # Uncomment if you want HTTP3
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      FORWARD_AUTH_SECRET: ${FORWARD_AUTH_SECRET}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/traefik.yml:ro
      # - ./config/acme.json:/acme.json
      - type: bind
        source: ./config/acme.json
        target: /acme.json
      - ./config/config.yml:/config.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`traefik-dashboard.calzone.zone`)"
      - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.traefik.middlewares=traefik-https-redirect"
      - "traefik.http.routers.traefik-secure.entrypoints=https"
      - "traefik.http.routers.traefik-secure.rule=Host(`traefik-dashboard.calzone.zone`)"
      - "traefik.http.routers.traefik-secure.middlewares=pocket-id-auth@file"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=calzone.zone"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.calzone.zone"
      - "traefik.http.routers.traefik-secure.service=api@internal"

networks:
  # Stays `external: true` deliberately -- deploy.sh creates it.
  #
  # Seventeen stacks attach to `proxy`, and until recently nothing created it:
  # it was a `docker network create proxy` typed by hand in Dec 2024 and
  # recorded nowhere, so a rebuilt host failed on the first stack with
  # "network proxy declared as external, but could not be found".
  #
  # The obvious fix -- declaring it here as a compose-managed network -- does
  # not work on a host that is already running. Compose refuses to adopt a
  # network it did not create:
  #
  #   network proxy was found but has incorrect label
  #   com.docker.compose.network set to "" (expected: "proxy")
  #
  # The live network has no compose labels, so switching would break every
  # traefik deploy until all seventeen stacks were stopped and the network
  # recreated. deploy.sh does an idempotent `docker network create` instead:
  # cold boot works, warm host is a no-op, no downtime.
  proxy:
    external: true
