global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    scrape_interval: 15s
    static_configs:
      - targets: ['traefik:8080']

  # MCPJungle exposes OTel metrics at /metrics in enterprise mode. Reachable
  # by container name because both it and Prometheus sit on the proxy network.
  - job_name: 'mcpjungle'
    scrape_interval: 15s
    static_configs:
      - targets: ['mcpjungle:8080']

  # Backrest. Scraped via the backrest-metrics network alias, not `backrest` —
  # the container name collides with the backrest.calzone.zone CNAME that
  # adguard-sync publishes, which resolves to the host where 9898 isn't
  # published. See the alias in backup/docker-compose.yaml.
  - job_name: 'backrest'
    static_configs:
      - targets: ['backrest-metrics:9898']

  - job_name: pikiosk
    static_configs:
      - targets: ['100.86.212.93:9100']
        labels:
          device: pikiosk

  # gpu-host — the RTX 3090 box, also known as `hermes`. Scraped over
  # Tailscale: it sits on 192.168.1.0/24 while docker01 is on 192.168.99.0/24,
  # and the LAN path depends on inter-VLAN routing that Tailscale does not.
  # Exporters are defined in gpu-host/docker-compose.yaml, which deploys to
  # that host, not docker01.
  # Labelled `host`, not `device` as the pikiosk job above does: node_network_*
  # and node_disk_* already carry their own `device` label (the interface or
  # block device). A target label of the same name does not merge — Prometheus
  # renames the scraped one to `exported_device`, which quietly breaks any
  # per-interface query. Dashboards select on `job` anyway.
  - job_name: 'gpu-host-node'
    scrape_interval: 15s
    static_configs:
      - targets: ['100.123.167.70:9100']
        labels:
          host: gpu-host

  - job_name: 'gpu-host-gpu'
    scrape_interval: 15s
    static_configs:
      - targets: ['100.123.167.70:9835']
        labels:
          host: gpu-host

  # Blackbox: services with unauthenticated 200 endpoints
  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://photos.calzone.zone/api/server/ping
          - https://mealie.calzone.zone/api/app/about
          - https://audiobookshelf.calzone.zone/healthcheck
          - https://grafana.calzone.zone/api/health
          - https://requests.calzone.zone/api/v1/status
          - https://mcp.calzone.zone/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # Blackbox: services that return 302 (login redirect or pocket-id-auth)
  - job_name: 'blackbox_http_redirect_ok'
    metrics_path: /probe
    params:
      module: [http_2xx_or_redirect]
    static_configs:
      - targets:
          - https://paperless.calzone.zone/accounts/login/
          - https://netbox.calzone.zone/login/
          - https://auth.calzone.zone/
          - https://sonarr.calzone.zone/ping
          - https://radarr.calzone.zone/ping
          - https://radarr-4k.calzone.zone/ping
          - https://prowlarr.calzone.zone/ping
          - https://bazarr.calzone.zone/ping
          - https://sabnzbd.calzone.zone/
          - https://frigate.calzone.zone/api/version
          - https://tautulli.calzone.zone/
          - https://bookrequests.calzone.zone/
          - https://alertmanager.calzone.zone/
          - https://portainer.calzone.zone/
          - https://backrest.calzone.zone/
          - https://maintainerr.calzone.zone/
          - https://traefik-dashboard.calzone.zone/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115