---
# Unit tests for rules/backup_alerts.yml.
#
# These live outside rules/ on purpose: prometheus.yaml globs `rules/*.yml` into
# rule_files, and a unit-test file matching that glob fails to parse as a rule
# group, which takes the whole config down on the next reload.
#
# `promtool check rules` is a syntax check, and every bug this file has shipped
# was syntactically perfect. BackupFailed used increase() on a counter backrest
# creates lazily, so it was blind to every first failure. BackupStale used
# increase() on that same counter and fired *because* a backup had just
# succeeded. The linter passed both. What breaks them is a series shape — a
# counter that vanishes on restart and comes back already at 1 — so that shape
# is what these tests feed in.
#
# The shape has to be the *real* one. The 2026-08-14 false positive shipped
# green past a rebirth fixture whose series was absent since the beginning of
# time, which no restart ever produces: a restarted target leaves its earlier
# incarnation in the TSDB, and reaching back into it is exactly what the old
# guard did wrong. A fixture that omits the prior samples cannot express that
# bug. Model the hole, not just the rebirth.
#
# Samples are 5m apart rather than the real 15s: nothing here turns on scrape
# granularity, and 36h of 15s samples would be 8640 points per series.

evaluation_interval: 5m

# Resolved relative to this file, not the working directory. A path that
# matches nothing is only a WARNING, and every "exp_alerts: []" assertion then
# passes vacuously — the firing assertions below are what keep that honest.
rule_files:
  - ../rules/backup_alerts.yml

tests:
  # Baseline. The counter steps once every 24h and nothing should alert.
  #
  # Every BackupStale case needs an `up` series now: the second clause counts
  # the counter's samples against the target's scrapes, so with no `up` the
  # right-hand side is empty, the match drops every sample, and the rule can
  # never fire — which would make each "exp_alerts: []" below pass for the
  # wrong reason. The firing assertions are what keep that honest.
  - interval: 5m
    name: healthy daily backups stay quiet
    input_series:
      - series: 'backrest_tasks_run_total{task_type="backup",status="success",plan_id="backups",repo_id="truenas-nfs",instance="backrest-metrics:9898",job="backrest"}'
        values: '1+0x287 2+0x287 3+0x287'
      - series: 'up{job="backrest",instance="backrest-metrics:9898"}'
        values: '1+0x900'
    alert_rule_test:
      - eval_time: 60h
        alertname: BackupStale
        exp_alerts: []

  # The shape that actually broke on 2026-08-14, and the one the previous
  # `offset 36h` guard could not see.
  #
  # The counter is born at t=0 by a nightly run, backrest restarts at t=11h so
  # the series goes absent, and the next nightly run reborns it at t=24h already
  # at 1. Backups are healthy throughout. What defeated the old guard is that
  # the pre-restart samples are still in the TSDB, so its probe at t-36h landed
  # on that earlier incarnation and reported the series as long-lived.
  #
  # Asserted twice, on both sides of where the old rule started paging: t=40h is
  # 16h after the rebirth, t=50h is past the point where a t-36h probe clears
  # the hole and lands on the pre-restart samples. Neither may fire.
  - interval: 5m
    name: a counter reborn by a restart with a prior incarnation in the TSDB stays quiet
    input_series:
      - series: 'backrest_tasks_run_total{task_type="backup",status="success",plan_id="backups",repo_id="truenas-nfs",instance="backrest-metrics:9898",job="backrest"}'
        values: '1+0x131 _x156 1+0x480'
      - series: 'up{job="backrest",instance="backrest-metrics:9898"}'
        values: '1+0x900'
    alert_rule_test:
      - eval_time: 40h
        alertname: BackupStale
        exp_alerts: []
      # The old rule was firing by here; this is the assertion that pins the fix.
      - eval_time: 50h
        alertname: BackupStale
        exp_alerts: []

  # The same rebirth, but with no prior incarnation — backrest restarts at t=0
  # having never been scraped before, so the counter is absent from the start
  # and the first backup re-creates it at 1 at t=36h, flat until the next day.
  #
  # This is the fixture that let the bug ship green: a series absent since the
  # beginning of time is the one rebirth shape that structurally cannot trip a
  # t-36h probe, so the old guard looked correct here. Kept because it still
  # pins the documented cost — suppressed while the counter is too young to
  # tell "flat because nothing ran" from "flat because it was just born", then
  # firing once it is old enough, so the fix cannot quietly become "never
  # fires". The case above is the one that reproduces the incident.
  - interval: 5m
    name: a counter reborn with no prior incarnation is suppressed, then fires once it is old enough
    input_series:
      - series: 'backrest_tasks_run_total{task_type="backup",status="success",plan_id="backups",repo_id="truenas-nfs",instance="backrest-metrics:9898",job="backrest"}'
        values: '_x431 1+0x600'
      - series: 'up{job="backrest",instance="backrest-metrics:9898"}'
        values: '1+0x1100'
    alert_rule_test:
      # 20h after the counter was re-created, so the window still spans the hole.
      - eval_time: 56h
        alertname: BackupStale
        exp_alerts: []
      # 38h after, so the hole has aged out and the window is fully covered.
      - eval_time: 74h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              task_type: backup
              status: success
              plan_id: backups
              repo_id: truenas-nfs
              instance: backrest-metrics:9898
              job: backrest
            exp_annotations:
              summary: "No successful backup in 36h (backups)"
              description: "Plan backups on repo truenas-nfs has not completed a successful backup in 36h."

  # The failure the rule is actually for: a plan that ran fine and then stopped.
  # Last success at t=24h, so the window clears it at t=60h and `for: 1h` lands
  # the page at t=61h.
  - interval: 5m
    name: a plan that stops succeeding still pages
    input_series:
      - series: 'backrest_tasks_run_total{task_type="backup",status="success",plan_id="backups",repo_id="truenas-nfs",instance="backrest-metrics:9898",job="backrest"}'
        values: '1+0x287 2+0x600'
      - series: 'up{job="backrest",instance="backrest-metrics:9898"}'
        values: '1+0x900'
    alert_rule_test:
      - eval_time: 62h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              task_type: backup
              status: success
              plan_id: backups
              repo_id: truenas-nfs
              instance: backrest-metrics:9898
              job: backrest
            exp_annotations:
              summary: "No successful backup in 36h (backups)"
              description: "Plan backups on repo truenas-nfs has not completed a successful backup in 36h."

  # The other half of the lazy-creation trap, guarding the decision to put
  # BackupFailed on the gauge. The series is absent until the first failure
  # creates it at 1 — no delta, so an increase()-based rule sees nothing. The
  # gauge alerts off that single sample.
  - interval: 5m
    name: the first failure after a restart alerts even with no prior sample
    input_series:
      - series: 'backrest_last_task_status{task_type="backup",status="failed",plan_id="backups",repo_id="truenas-nfs",instance="backrest-metrics:9898",job="backrest"}'
        values: '_x11 1+0x11'
    alert_rule_test:
      - eval_time: 1h30m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              task_type: backup
              status: failed
              plan_id: backups
              repo_id: truenas-nfs
              instance: backrest-metrics:9898
              job: backrest
            exp_annotations:
              summary: "Last backup failed (backups)"
              description: "The most recent backup of plan backups on repo truenas-nfs failed, and no successful backup has run since. The pre-backup hook is ON_ERROR_FATAL, so a failed pg_dump lands here rather than silently snapshotting stale dumps. This stays firing until a backup succeeds."
