name: Deploy

on:
  push:
    branches: [main]

# Serialize deploys onto the single self-hosted runner. Note this does NOT
# guarantee every push gets its own run: GitHub keeps only one *pending* run
# per group, so in a burst each new run cancels the previously queued one.
# cancel-in-progress: false only protects the run that is already executing.
# Losing a run is therefore normal and expected here — the deploy step below
# is written to recover from it rather than to prevent it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, docker01]
    steps:
      - name: Pull latest
        run: git -C /root/homelab-docker pull

      - name: Deploy changed stacks
        run: |
          # Must live inside /root/homelab-docker: that is the only writable
          # path bind-mounted from the host into the runner container (see
          # github-runner/docker-compose.yaml). Anywhere else — /root included —
          # is the container's own layer, so the marker would be destroyed every
          # time the runner is recreated (reboot, image bump, clean-state.sh)
          # and this would quietly fall back to event.before, which is the exact
          # dropped-deploy bug it exists to prevent. Gitignored; git pull leaves
          # ignored untracked files alone.
          MARKER=/root/homelab-docker/.deployed-sha
          AFTER="${{ github.sha }}"

          # Diff from the last SHA this host actually finished deploying, not
          # from github.event.before. A cancelled or failed run never writes the
          # marker, so whatever it was carrying is still pending and the next run
          # picks it up. Using event.before instead silently drops those changes
          # forever — that is how traefik v3.7.10 landed on main while docker01
          # kept running v3.7.9.
          BEFORE=""
          if [ -f "$MARKER" ]; then
            CANDIDATE=$(cat "$MARKER")
            # Ignore a marker that isn't an ancestor of HEAD (force-push, reset,
            # or a stale file); an invalid range would abort the whole deploy.
            if git -C /root/homelab-docker merge-base --is-ancestor "$CANDIDATE" "$AFTER" 2>/dev/null; then
              BEFORE="$CANDIDATE"
            else
              echo "Marker $CANDIDATE is not an ancestor of $AFTER — ignoring it."
            fi
          fi
          [ -n "$BEFORE" ] || BEFORE="${{ github.event.before }}"

          # First push, or the before-SHA is the all-zero sentinel: deploy all.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git -C /root/homelab-docker cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable baseline — deploying all stacks"
            /root/homelab-docker/deploy.sh
            echo "$AFTER" > "$MARKER"
            exit 0
          fi

          echo "Deploying changes from $BEFORE to $AFTER"

          CHANGED=$(git -C /root/homelab-docker diff --name-only "$BEFORE" "$AFTER" \
            | cut -d'/' -f1 \
            | sort -u)

          # Iterate deploy.sh's stack list rather than the diff. It is the only
          # source of truth for what runs on this host — a changed directory
          # that isn't in it (github-runner would restart us mid-job) must not
          # be deployed here. Its order also handles inter-stack dependencies,
          # so no re-sorting is needed.
          DEPLOYED=0
          for stack in $(/root/homelab-docker/deploy.sh --list); do
            printf '%s\n' "$CHANGED" | grep -qx "$stack" || continue
            echo "==> Deploying $stack"
            /root/homelab-docker/deploy.sh "$stack"
            DEPLOYED=$((DEPLOYED + 1))
          done

          # Say what was passed over, so a stack silently never deploying here
          # is visible in the log rather than looking like a clean run.
          for stack in $CHANGED; do
            [ -f "/root/homelab-docker/$stack/docker-compose.yaml" ] || continue
            /root/homelab-docker/deploy.sh --list | grep -qx "$stack" \
              || echo "--> Skipping $stack (not in deploy.sh's stack list)"
          done

          if [ "$DEPLOYED" -eq 0 ]; then
            echo "No deployable stack changes detected, nothing to deploy."
          fi

          # Only advance the marker once every stack above succeeded. The step
          # runs under `bash -e`, so a failed deploy.sh aborts before this line
          # and the range stays pending for the next run to retry.
          echo "$AFTER" > "$MARKER"
          echo "Marked $AFTER as deployed."
