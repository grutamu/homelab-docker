name: Validate

# Renovate automerges image bumps straight to main, and a merge to main
# auto-deploys. This is the only gate in between: it must stay a required-in-
# practice check, because without any pull_request workflow at all a branch has
# zero statuses, GitHub reports its combined state as "pending", and Renovate's
# automerge waits on a green status that can never arrive.
on:
  pull_request:

concurrency:
  group: validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The runner is self-hosted, runs as root, and has the Docker socket bound
    # in. Never run PR code from a fork on it. Renovate's branches live in this
    # repo, so they satisfy this.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, docker01]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate changed stacks
        run: |
          BASE="origin/${{ github.base_ref }}"

          CHANGED=$(git diff --name-only "$BASE"...HEAD | cut -d'/' -f1 | sort -u)

          # Validate anything with a compose file, including stacks deploy.sh
          # does not deploy from this host (gpu-host) — a broken compose file
          # there is still worth catching before it merges.
          STACKS=""
          for stack in $CHANGED; do
            [ -f "$stack/docker-compose.yaml" ] && STACKS="$STACKS $stack"
          done

          if [ -z "$STACKS" ]; then
            echo "No stack changes to validate."
            exit 0
          fi

          RC=0
          for stack in $STACKS; do
            echo "==> $stack"

            # No stack uses env_file: and none use ${VAR:?}, so schema and
            # interpolation validate fine with secrets absent — unset vars only
            # warn. This checks the file parses and the schema is still valid.
            if ! docker compose -f "$stack/docker-compose.yaml" config -q; then
              echo "::error::$stack: docker compose config failed"
              RC=1
              continue
            fi

            # Confirm the tags this PR *introduces* resolve in their registry.
            # This is the check that matters for Renovate: a bump to a tag that
            # was never published would otherwise merge and break the deploy.
            #
            # Only the added image: lines, not every image in the stack. Docker
            # Hub allows ~100 anonymous manifest requests per 6h per IP, and
            # re-checking untouched images across concurrent PRs exhausts that
            # for no signal — an image already on main was verified when it
            # landed. Scoping to the diff cut this roughly tenfold.
            for image in $(git diff "$BASE"...HEAD -- "$stack/docker-compose.yaml" \
                             | sed -n 's/^+[[:space:]]*image:[[:space:]]*//p' \
                             | tr -d "\"'" | sort -u); do
              # An exhausted quota returns a generic failure that is easy to
              # misread as a missing tag. "Could not verify" is not "does not
              # exist" — warn, never fail, or a rate limit silently blocks
              # every automerge.
              if err=$(docker manifest inspect "$image" 2>&1 >/dev/null); then
                echo "    ok  $image"
              elif printf '%s' "$err" | grep -qiE 'toomanyrequests|too many requests|rate limit'; then
                echo "::warning::$stack: registry rate limit — could not verify $image"
              else
                echo "::error::$stack: image not found in registry: $image"
                echo "        $err"
                RC=1
              fi
            done
          done

          exit $RC

      # The stack loop above cannot see this: Prometheus reads its config and
      # rules from a bind mount, so `docker compose config` validates the
      # compose schema and never opens the thing Prometheus actually evaluates.
      #
      # This runs the unit tests, not just the linter, because the linter is not
      # the check that matters. Both rule bugs this repo has shipped were
      # increase() over a counter that resets to absent on every backrest
      # restart — BackupFailed blind to every first failure, BackupStale firing
      # *because* a backup had just succeeded — and `check rules` reported
      # SUCCESS on both. A wrong alerting rule is almost always a valid one.
      - name: Validate Prometheus config and rules
        run: |
          BASE="origin/${{ github.base_ref }}"

          if git diff --quiet "$BASE"...HEAD -- monitoring/prometheus/; then
            echo "No Prometheus config changes."
            exit 0
          fi

          # Pinned to the deployed Prometheus so the promtool doing the checking
          # cannot drift from the binary that will evaluate these rules.
          VERSION=$(sed -n 's|^[[:space:]]*image:[[:space:]]*prom/prometheus:||p' \
                      monitoring/docker-compose.yaml)
          echo "Using promtool from prom/prometheus:$VERSION"

          # docker cp rather than -v: this runner is a container talking to the
          # host's Docker daemon, and only /root/homelab-docker is bind-mounted
          # through at a shared path. The Actions workspace does not exist on
          # the host, so a -v of it would mount an empty auto-created directory
          # and check a copy of the config that isn't there. docker cp streams
          # through the client, which reads the workspace directly.
          promtool() {
            local cid rc=0
            cid=$(docker create -w /tmp/prometheus \
                    --entrypoint promtool "prom/prometheus:$VERSION" "$@")
            docker cp monitoring/prometheus/. "$cid:/tmp/prometheus" >/dev/null
            docker start -a "$cid" || rc=$?
            docker rm -f "$cid" >/dev/null
            return $rc
          }

          # Covers every file the rule_files glob picks up, so it also catches a
          # non-rule file landing in rules/ — which fails the next reload and
          # leaves Prometheus silently running the previous config.
          promtool check config prometheus.yaml

          # Paths are relative to the container's workdir, so strip the prefix.
          TESTS=$(cd monitoring/prometheus && ls tests/*.yml 2>/dev/null || true)
          if [ -z "$TESTS" ]; then
            echo "::warning::no promtool unit tests found"
            exit 0
          fi

          # A rule_files path inside a test file that matches nothing is only a
          # WARNING, and every "exp_alerts: []" assertion then passes against no
          # rules at all. Treat it as a failure.
          out=$(promtool test rules $TESTS 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if printf '%s' "$out" | grep -q 'no file match pattern'; then
            echo "::error::a test file's rule_files path matched nothing — tests ran against no rules"
            exit 1
          fi
