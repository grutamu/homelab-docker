# Docker Compose file for running paperless from the Docker Hub.
# This file contains everything paperless needs to run.
# Paperless supports amd64, arm and arm64 hardware.
#
# All compose files of paperless configure paperless in the following way:
#
# - Paperless is (re)started on system boot, if it was running before shutdown.
# - Docker volumes for storing data are managed by Docker.
# - Folders for importing and exporting files are created in the same directory
#   as this file and mounted to the correct folders inside the container.
# - Paperless listens on port 8010.
#
# In addition to that, this Docker Compose file adds the following optional
# configurations:
#
# - Instead of SQLite (default), PostgreSQL is used as the database server.
#
# To install and update paperless with this file, do the following:
#
# - Open portainer Stacks list and click 'Add stack'
# - Paste the contents of this file and assign a name, e.g. 'paperless'
# - Upload 'docker-compose.env' by clicking on 'Load variables from .env file'
# - Modify the environment variables as needed
# - Click 'Deploy the stack' and wait for it to be deployed
#
# For more extensive installation and update instructions, refer to the
# documentation.

services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - /docker-data/paperless/redisdata:/data
    networks:
      - paperless
  db:
    # Pinned to major 17 to match the on-disk data dir (PG_VERSION=17).
    # A major bump (e.g. 18) requires a pg_dump/restore migration — bumping
    # this tag and recreating would break the DB. Renovate major updates for
    # postgres are disabled in renovate.json.
    image: docker.io/library/postgres:17
    restart: unless-stopped
    volumes:
      - /docker-data/paperless/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD:
    networks:
      - paperless
  webserver:
    # Built locally from ./Dockerfile — paperless-ngx plus the
    # paperless-paddleocr plugin. The paperless-ngx version is pinned by the
    # FROM line in that Dockerfile, which is what Renovate now updates; there is
    # no ghcr.io tag to pin here anymore.
    #
    # No `image:` here, matching the other build stacks. It is not just style:
    # the validate workflow runs `docker manifest inspect` on every image: line
    # a PR adds, and a locally-built tag exists in no registry, so naming it
    # would fail CI. Compose names the image `paperless-webserver` by default.
    #
    # deploy.sh passes --build for any stack carrying a Dockerfile. Without it
    # `compose up -d` would only build when the image is missing, so a Renovate
    # bump to the base image would merge, deploy green, and leave the old image
    # running.
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - db
      - broker
#    ports:
#      - "8010:8000"
    volumes:
      - /docker-data/paperless/data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - /docker-data/paperless/export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS:
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
      PAPERLESS_URL:
      PAPERLESS_SECRET_KEY:
      PAPERLESS_TIME_ZONE: America/Chicago
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_CONSUMER_POLLING: "10"
      # PaddleOCR-VL. Layout work happens in this container on CPU; the VLM
      # recognition calls go to the server on gpu-host.
      PAPERLESS_PADDLEOCR_ENGINE: vl-remote
      # No /v1 suffix needed — the plugin appends it. Resolves to 192.168.1.43
      # from inside the container (LAN via calzone.zone), not the Tailscale
      # address the host resolves it to, so the page images stay on the LAN.
      # The server has no authentication, so PAPERLESS_PADDLEOCR_VL_API_KEY is
      # deliberately unset; setting it would send a Bearer token nothing checks.
      PAPERLESS_PADDLEOCR_VL_SERVER_URL: http://gpu-host:8022
      # The *served model id*, not the model family. vLLM matches this string
      # against the `id` in /v1/models, which is `paddleocr-vl`; sending
      # `PaddleOCR-VL-1.6` gets a 404 NotFoundError even though that is what the
      # server is actually running.
      PAPERLESS_PADDLEOCR_VL_MODEL_NAME: paddleocr-vl
      # Must match the model family gpu-host serves (root: PaddleOCR-VL-1.6).
      # This is NOT the plugin default — it defaults to v1.5, which would send
      # a 1.5-era prompt to a 1.6 model. Re-check this whenever gpu-host's model
      # changes.
      PAPERLESS_PADDLEOCR_VL_PIPELINE_VERSION: v1.6
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.paperless.rule=Host(`paperless.calzone.zone`)"
      - "traefik.http.routers.paperless.entrypoints=https"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    networks:
      - proxy
      - paperless
networks:
  proxy:
    external: true
  paperless:
volumes:
  media:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/ssd-pool/apps/paperless"
  consume:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.calzone.zone,nolock,soft,nfsvers=4"
      device: ":/mnt/ssd-pool/apps/paperless/consume"
